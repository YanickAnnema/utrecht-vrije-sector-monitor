name: Vrije sector monitor

on:
  repository_dispatch:
    types: [telegram_update, scheduled_check]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Alleen aanbod ophalen, zonder melding of statuswijziging
        required: false
        type: boolean
        default: false
      report:
        description: Stuur de actuele telling en vrije-sectorwoningen naar Telegram
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vrije-sector-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Controleer configuratie
        id: config
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ "${{ inputs.dry_run }}" == "true" || ( -n "$TELEGRAM_BOT_TOKEN" && -n "$TELEGRAM_CHAT_ID" ) ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Telegram Secrets ontbreken; monitor blijft inactief"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - if: steps.config.outputs.ready == 'true'
        run: pip install -r requirements.txt
      - if: steps.config.outputs.ready == 'true'
        run: python -m playwright install --with-deps chromium
      - name: Controleer aanbod en stuur melding
        if: steps.config.outputs.ready == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            python monitor.py --dry-run
          elif [[ "${{ github.event.action }}" == "telegram_update" || "${{ inputs.report }}" == "true" ]]; then
            python monitor.py --report
          else
            python monitor.py
          fi
      - name: Bewaar gevonden ID's
        if: steps.config.outputs.ready == 'true' && inputs.dry_run != true
        run: |
          git add seen_ids.json
          if git diff --cached --quiet; then
            echo "Geen nieuwe ID's om op te slaan"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update gevonden vrije-sectoradvertenties"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
